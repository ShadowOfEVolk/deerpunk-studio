[package]
name = "deerpunk-studio"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = "0.36"
egui-phosphor = "0.14"
egui_extras = { version = "0.36", features = ["file", "image", "svg"] }
image = "0.25.10"
libc = "0.2.191"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tungstenite = "0.30.0"
walkdir = "2.5.0"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu", "eframe"] }
