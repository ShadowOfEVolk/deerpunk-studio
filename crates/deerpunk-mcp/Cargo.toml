[package]
name = "deerpunk-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server proxying the deerpunk engine inspector (JSON-RPC over WebSocket)"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std", "io-util", "time"] }
tungstenite = "0.30"
libc = "0.2"

[lints.rust]
# `deny` (not `forbid`) so pid_alive() can carry a local `#[allow(unsafe_code)]`
# for its single libc::kill existence probe.
unsafe_code = "deny"
