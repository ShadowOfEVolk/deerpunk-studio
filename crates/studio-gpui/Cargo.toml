[package]
name = "studio-gpui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "deerpunk-studio"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9.1"
deerpunk-studio = { path = "../.." }
deerpunk-engine-common = { path = "../../../deerpunk/crates/engine-common" }
deerpunk-engine-renderer = { path = "../../../deerpunk/crates/engine-renderer" }
deerpunk-ui = { path = "../../../deerpunk/crates/engine-ui" }
# GPU rasterization of the RmlUi preview via the engine's UiPass; wgpu must
# be exactly the engine's major (type unification with deerpunk-engine-renderer).
wgpu = "30"
pollster = "0.4"
image = "0.25.10"
quick-xml = { version = "0.41", default-features = false }
rfd = "0.18.0"
toml = "1.2.1"
puffin = "0.20"
puffin_http = "0.17"

serde_json = "1"
# Подсветка синтаксиса текстового вьюера: Sublime-синтаксисы, чистый Rust
# (fancy-regex вместо oniguruma).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
# Headless UI-тесты (M6): test-support напрямую через gpui-pre, НЕ через
# gpui-kit/test-support (конфликт taffy-пина через gpui-fast).
gpui = { version = "=0.3.12", package = "gpui-pre", features = ["test-support"] }
gpui-platform = { version = "=0.3.12", package = "gpui-pre-platform", features = ["test-support"] }
